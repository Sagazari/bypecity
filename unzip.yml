name: Desempacotar ZIP
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
concurrency: unzip
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desempacotar
        run: |
          shopt -s nullglob
          for z in *.zip; do
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            if [ "$(ls -A "$tmp" | wc -l)" -eq 1 ] && [ -d "$tmp/$(ls -A "$tmp")" ]; then src="$tmp/$(ls -A "$tmp")"; else src="$tmp"; fi
            rsync -a --exclude='.github' --exclude='*.zip' "$src"/ ./
            git rm -q -f "$z"
          done
      - name: Salvar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "ZIP desempacotado automaticamente" && git push)
