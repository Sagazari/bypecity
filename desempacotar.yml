name: Desempacotar ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "bype-eleicoes.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Desempacotar arquivo ZIP
        run: |
          unzip -o "bype-eleicoes.zip" -d .

      - name: Salvar arquivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Desempacota bype-eleicoes.zip"
            git push
          fi
