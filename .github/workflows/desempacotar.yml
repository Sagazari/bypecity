
name: Desempacotar ZIP automaticamente

on:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/desempacotar.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair arquivos do ZIP
        shell: bash
        run: |
          set -e
          shopt -s nullglob

          zips=( *.zip )

          if [ ${#zips[@]} -eq 0 ]; then
            echo "Nenhum ZIP encontrado na raiz."
            exit 1
          fi

          mkdir -p /tmp/bype-extract

          for archive in "${zips[@]}"; do
            echo "Extraindo: $archive"
            unzip -o "$archive" -d /tmp/bype-extract
          done

          if [ -d /tmp/bype-extract/bype-eleicoes ]; then
            cp -a /tmp/bype-extract/bype-eleicoes/. .
          else
            echo "Pasta interna bype-eleicoes não encontrada."
            exit 1
          fi

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "mavero-bot"
          git config user.email "bot@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Arquivos atualizados automaticamente"
          git push
