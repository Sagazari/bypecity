
name: Desempacotar Bype

on:
  push:
    paths:
      - "bype-city.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair arquivos na raiz
        run: |
          mkdir -p "$RUNNER_TEMP/bype-extract"

          unzip -o bype-city.zip -d "$RUNNER_TEMP/bype-extract"

          cp -a "$RUNNER_TEMP/bype-extract/bype-city/." .

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Desempacotar projeto Bype"
          git push
