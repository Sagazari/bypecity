
name: Desempacotar ZIP automaticamente

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIP
        run: |
          find . -type f -name "*.zip" -print0 | while IFS= read -r -d '' file; do
            unzip -o "$file" -d .
          done

      - name: Salvar arquivos
        run: |
          git config user.name "mavero-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Arquivos desempacotados"
          git push
