<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<meta name="theme-color" content="#7a1fe0">
<meta property="og:type" content="website"><meta property="og:site_name" content="Bype City"><meta property="og:locale" content="pt_BR">
<meta property="og:title" content="__TITLE__"><meta property="og:description" content="__DESC__"><meta property="og:image" content="__ORIGIN__/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="__ORIGIN____PATH__">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="__TITLE__"><meta name="twitter:image" content="__ORIGIN__/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏙️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--r:#7a1fe0;--tx:#1f1f1f;--mu:#6b6b6b;--ln:#e3e3e3;--bg:#f3f3f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Open Sans",Arial,sans-serif}
header{background:var(--r);color:#fff}
.top{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{height:38px;background:#fff;border-radius:4px;padding:2px}
.top b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}.top span{font-size:12px;font-weight:600;opacity:.9;display:block;letter-spacing:.06em;text-transform:uppercase}
nav{background:#fff;border-bottom:1px solid var(--ln)}
nav div{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
nav a,nav button{text-decoration:none;display:block;background:none;border:0;border-bottom:3px solid transparent;font:800 13px "Open Sans",Arial;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:14px 12px;cursor:pointer;white-space:nowrap}
nav a.on,nav button.on{color:var(--r);border-color:var(--r)}
main{max-width:1100px;margin:0 auto;padding:16px}
.c{background:#fff;border:1px solid var(--ln);padding:16px;margin-bottom:16px}
.k{color:var(--r);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.k.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--r);margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
h2{font-size:18px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.btn{background:var(--r);color:#fff;border:0;font:800 13px "Open Sans",Arial;letter-spacing:.04em;text-transform:uppercase;padding:12px 18px;cursor:pointer}
.btn.s{background:#fff;color:var(--r);border:2px solid var(--r);padding:10px 16px}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#ddd;flex:none;border:3px solid var(--r)}
.cd{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--ln);margin-bottom:8px;background:#fff}
.cd.pick{cursor:pointer}.cd.on{outline:3px solid var(--r);outline-offset:-3px}
.n{font-weight:800;line-height:1.2}.num{font-size:28px;font-weight:800;margin-left:auto;letter-spacing:-.03em}
.pct{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;text-align:right;min-width:92px}
.bar{height:8px;background:#e9e9e9;margin:6px 0 2px}.bar i{display:block;height:100%;transition:width .6s}
.win{display:flex;gap:16px;align-items:center;border-left:6px solid var(--r);background:#fff;padding:16px;margin-bottom:16px;border-top:1px solid var(--ln);border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.win .ph{width:84px;height:84px}
.map{width:100%;height:auto;display:block;background:#ddd}
.map image{filter:grayscale(1) brightness(1.12) contrast(.85)}
.rg{stroke:#fff;stroke-width:.8;stroke-linejoin:round;cursor:pointer;transition:fill .6s,fill-opacity .6s;fill-opacity:.88}
.rg.off{fill:#e4e4e4;fill-opacity:.4}.rg.sel{stroke:#111;stroke-width:2.2}.rg:hover{stroke:#111}
.bd{fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;pointer-events:none}
.bl{font:800 11px "Open Sans",Arial;fill:#fff;stroke:#000;stroke-width:3;paint-order:stroke;text-anchor:middle;pointer-events:none}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;font-weight:600}
.dot{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
input,select,textarea{font:inherit;border:1px solid #bbb;padding:10px;width:100%;background:#fff;border-radius:0}
input[type=color]{width:56px;height:42px;padding:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--ln);background:#fff;padding:5px 12px;font:600 13px "Open Sans";border-radius:99px;cursor:pointer}.chip.on{background:var(--r);color:#fff;border-color:var(--r)}
.op{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--ln);margin-bottom:6px;cursor:pointer;font-size:14px}.op input{width:auto}.op:has(input:checked){border-color:var(--r);background:#f4ecfd}
fieldset{border:0;border-top:1px solid var(--ln);margin:0;padding:14px 0}legend{font-weight:800;padding:0 0 6px}
.lh{font-size:20px;font-weight:800;color:var(--r);margin:24px 0 6px;letter-spacing:-.01em;border-bottom:3px solid var(--r);padding-bottom:4px}.lh:first-child{margin-top:0}.ls{font-size:14px;font-weight:800;margin:16px 0 2px;text-transform:uppercase;letter-spacing:.04em}.art{padding:10px 0;border-bottom:1px solid var(--ln)}.art div{margin-top:3px;color:#333}.art b{color:var(--r)}textarea.big{font:13px/1.5 ui-monospace,Menlo,monospace}
a.btn,a.chip{display:inline-block;text-decoration:none}a.btn{color:#fff}a.btn.s{color:var(--r)}a.chip{color:inherit}.tile{display:block;background:#fff;border:1px solid var(--ln);border-top:4px solid var(--r);padding:14px;text-decoration:none;color:var(--tx)}.tile b{font-size:20px;letter-spacing:-.02em;display:block}.tile span{font-size:13px;color:var(--mu)}summary .dot{vertical-align:-1px}
#nav{overflow-x:auto;white-space:nowrap}
footer{max-width:1100px;margin:0 auto;padding:8px 16px 32px;color:var(--mu);font-size:12px}
.ld{padding:60px 20px;text-align:center;color:var(--mu)}
@media(max-width:820px){.grid{grid-template-columns:1fr}h1{font-size:23px}.pct{font-size:21px;min-width:76px}.g2{grid-template-columns:1fr}.top b{font-size:22px}}
</style>
</head>
<body>
<header><div class="top"><img src="__LOGO__" alt=""><a href="/" data-nav style="color:#fff;text-decoration:none"><b>bype city</b><span>Prefeitura · Eleições · Órgãos</span></a></div></header>
<nav><div id="nav"></div></nav>
<main id="app"><div class="ld">Carregando…</div></main>
<footer>Bype City · Portal da cidade</footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
__ASSETS__
let LZ=null,LQ='',LTE=null,FORM=null,FQ=null,FD={r:[]},fdone=false,M,RB,RR,ST=null,tab='inicio',token=localStorage.getItem('bype_token'),pw=sessionStorage.getItem('bype_pw'),selR=null,selC=null,rsel=null,vt=null,auto=null,adm=null,lastJ='',regName='',foto=null,busy=false,dirty=false;
async function api(p,o){if(window.DEMO){const r=CORE.handle((o&&o.method)||'GET',p,o&&o.body?JSON.parse(o.body):{},(o&&o.headers)||{});if(r.status>=400)throw new Error(r.json.erro);return r.json}
 const r=await fetch(p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||'Erro de conexão');return j}
const post=(p,b,h)=>api(p,{method:'POST',headers:{'Content-Type':'application/json',...h},body:JSON.stringify(b)});
const A=(a,b={})=>post('/api/admin/'+a,b,{'x-admin':pw||''});
/* mapa */
function mapSVG(fill,sel,lb){return `<svg class="map" viewBox="0 0 ${M.W} ${M.H}"><image href="${IMG}" width="${M.W}" height="${M.H}"/>`+
 M.R.map(r=>{const f=fill(r);return `<path class="rg${f?'':' off'}${sel===r.id?' sel':''}" data-r="${r.id}" d="${r.d}"${f?` style="fill:${f}"`:''}><title>${esc(r.n)}</title></path>`}).join('')+
 M.B.map(b=>`<path class="bd" d="${b.d}"/>`).join('')+(lb?M.B.map(b=>`<text class="bl" x="${b.c[0]}" y="${b.c[1]}">${b.s}</text>`).join(''):'')+'</svg>'}

/* dados */
const C=()=>ST.C,S=()=>ST.S,cands=n=>(S()['c'+n]||[]).filter(i=>C()[i]);
function tally(n){const a=ST.AP[n];if(!a)return null;const tot={};let br=0,k=0;
 for(const r in a.reg){k++;for(const c in a.reg[r])c==='branco'?br+=a.reg[r][c]:(tot[c]=(tot[c]||0)+a.reg[r][c])}
 const valid=cands(n).reduce((s,i)=>s+(tot[i]||0),0);return{reg:a.reg,tot,br,n:k,valid}}
const vv=c=>c.vice&&ST.V&&ST.V[c.vice]?esc(ST.V[c.vice].nome):'';
const pc=(v,t)=>(t?v/t*100:0).toFixed(2).replace('.',',')+'%';
const foto1=c=>c.foto?`<img class="ph" src="${c.foto}" alt="" style="border-color:${esc(c.cor)}">`:`<div class="ph" style="border-color:${esc(c.cor)};display:grid;place-items:center;font-weight:800;color:#777">${esc((c.nome||'?')[0])}</div>`;

/* render */
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()},60));

function eleicoes(){const s=S(),me=ST.me,f=s.fase;
 let h=`<div class="c"><span class="k${f==='votacao'?' live':''}">${{espera:'Em breve',votacao:'Votação aberta',apuracao:'Apuração em andamento',encerrada:'Encerrada'}[f]}</span><h1>${esc(s.titulo)}</h1><div class="mu">${s.turno}º turno</div></div>`;
 if(f==='encerrada'&&s.eleito&&C()[s.eleito])h+=winner();
 if(!me)return h+`<div class="c"><h2>Cadastro do eleitor</h2><p class="mu">Informe seu nome e a região onde você mora em Bype City. Depois de confirmada, ela não pode ser alterada.</p>
  <div class="grid"><div>${mapSVG(r=>r.id===selR?'#7a1fe0':null,selR,true)}</div><div>
  <input id="rn" placeholder="Seu nome" value="${esc(regName)}" maxlength="40" style="margin-bottom:8px">
  <select id="rr"><option value="">Escolha sua região</option>${M.B.map(b=>`<optgroup label="${esc(b.n)}">${M.R.filter(r=>r.b===b.id).map(r=>`<option value="${r.id}"${r.id===selR?' selected':''}>${esc(r.n)}</option>`).join('')}</optgroup>`).join('')}</select>
  <div style="height:10px"></div><button class="btn" data-act="reg" ${busy?'disabled':''}>Confirmar cadastro</button></div></div></div>`;
 h+=`<div class="c"><div class="mu">Você vota em <b>${esc(RR[me.r].n)}</b> (${esc(RB[RR[me.r].b].n)}) · ${esc(me.n)}</div></div>`;
 if(f==='votacao'){
  if(me.voted)h+=`<div class="c"><h2>Voto registrado no ${s.turno}º turno</h2><div class="mu">Acompanhe o resultado na aba Apuração.</div></div>`;
  else h+=`<div class="c"><h2>Escolha seu candidato</h2>${cands(s.turno).map(id=>card(id,true)).join('')}
   <div class="cd pick${selC==='branco'?' on':''}" data-c="branco"><div class="ph" style="display:grid;place-items:center;border-color:#999">▢</div><div class="n">Voto em branco</div></div>
   <button class="btn" style="width:100%" data-act="vote" ${selC&&!busy?'':'disabled'}>Confirmar voto</button></div>`}
 else if(f==='apuracao')h+=`<div class="c"><h2>Votação encerrada</h2><a class="btn" href="/apuracao" data-nav>Acompanhar apuração</a></div>`;
 else if(f==='espera')h+=`<div class="c"><div class="mu">Aguarde: a votação ainda não foi aberta.</div></div>`;
 return h}
function card(id,pick){const c=C()[id];return `<div class="cd${pick?' pick':''}${pick&&selC===id?' on':''}" ${pick?`data-c="${id}"`:''}>${foto1(c)}<div><div class="n">${esc(c.nome)}</div><div class="mu">${esc(c.partido)}${c.plano?' · '+esc(c.plano):''}</div>${vv(c)?`<div class="mu">Vice: <b>${vv(c)}</b></div>`:''}</div><div class="num" style="color:${esc(c.cor)}">${esc(c.num)}</div></div>`}
function winner(){const c=C()[S().eleito];return `<div class="win" style="border-left-color:${esc(c.cor)}">${foto1(c)}<div><div class="k">Eleito${S().turno===1?' no 1º turno':' no 2º turno'}</div><div style="font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1">${esc(c.nome)}</div><div class="mu">${esc(c.partido)} · ${esc(c.num)}</div>${vv(c)?`<div class="mu">Vice-prefeito: <b>${vv(c)}</b></div>`:''}</div></div>`}
function leisHTML(t,q){q=(q||'').trim().toLowerCase();const out=[];let cur=null;const push=()=>{if(cur){out.push(cur);cur=null}};
 for(const raw of t.split('\n')){const l=raw.trim();if(!l){push();continue}
  if(l[0]==='#'){push();out.push({k:l.startsWith('##')?'h3':'h2',t:l.replace(/^#+\s*/,'')});continue}
  if(/^Art\./i.test(l)){push();cur={k:'a',ls:[l]};continue}
  if(cur)cur.ls.push(l);else cur={k:'p',ls:[l]}}push();
 const f=out.filter(x=>!q||(x.k==='a'||x.k==='p')&&x.ls.join(' ').toLowerCase().includes(q));
 if(!f.length)return '<div class="mu">Nenhum artigo encontrado.</div>';
 return f.map(x=>x.k==='h2'?`<h2 class="lh">${esc(x.t)}</h2>`:x.k==='h3'?`<h3 class="ls">${esc(x.t)}</h3>`:`<div class="art">${x.ls.map((s,i)=>{const m=i===0&&x.k==='a'&&s.match(/^(Art\.\s*\d+[ºo°]?\.?)\s*(.*)$/i);return `<div>${m?`<b>${esc(m[1])}</b> ${esc(m[2])}`:s[0]==='-'?'• '+esc(s.replace(/^-\s*/,'')):esc(s)}</div>`}).join('')}</div>`).join('')}
function leis(){if(!LZ)return '<div class="ld">Carregando…</div>';
 return `<div class="c"><span class="k">Legislação municipal</span><h1>Constituição e leis de Bype City</h1><div class="mu" style="margin-bottom:12px">As leis da cidade são aplicadas pelo Tribunal Federal Municipal (TFM).</div><input id="lq" placeholder="Buscar nas leis…" value="${esc(LQ)}"></div><div class="c" id="lbody">${leisHTML(LZ.texto,LQ)}</div>`}
function leisEd(){if(!LZ)return '';return `<div class="c"><h2>Legislação (TFM)</h2><div class="mu" style="margin-bottom:8px">Use <b>#</b> para título, <b>##</b> para capítulo, linhas começando com <b>Art.</b> para artigos e <b>-</b> para itens.</div><textarea id="lt" class="big" rows="16">${esc(LTE!=null?LTE:LZ.texto)}</textarea><div style="height:8px"></div><button class="btn" data-act="saveLeis">Publicar legislação</button></div>`}
function list(){const ids=Object.keys(C());return `<div class="c"><span class="k">Candidatos</span><h1>Quem disputa</h1></div>`+(ids.length?`<div class="cg">${ids.map(id=>`<div class="c" style="margin:0;text-align:center;border-top:5px solid ${esc(C()[id].cor)}"><div style="display:flex;justify-content:center;margin-bottom:8px">${foto1(C()[id]).replace('class="ph"','class="ph" style="width:96px;height:96px;border-color:'+esc(C()[id].cor)+'"')}</div><div class="n">${esc(C()[id].nome)}</div><div class="mu">${esc(C()[id].partido)}</div>${vv(C()[id])?`<div class="mu">Vice: <b>${vv(C()[id])}</b></div>`:''}<div class="num" style="margin:4px 0;color:${esc(C()[id].cor)}">${esc(C()[id].num)}</div><div class="mu">${esc(C()[id].plano)}</div></div>`).join('')}</div>`:'<div class="c mu">Nenhum candidato cadastrado ainda.</div>')}

function results(){
 const s=S(),n=vt||s.turno,both=s.turno===2||(s.c2||[]).length,live=s.fase==='apuracao'&&n===s.turno;
 let h=`<div class="c"><div class="row"><span class="k${live?' live':''}">${live?'Ao vivo':'Resultado'}</span><div style="margin-left:auto" class="row">${both?[1,2].map(k=>`<button class="chip${n===k?' on':''}" data-vt="${k}">${k}º turno</button>`).join(''):''}</div></div><h1>${esc(s.titulo)}</h1></div>`;
 if(s.fase==='encerrada'&&s.eleito&&n===s.turno&&C()[s.eleito])h+=winner();
 const t=tally(n);
 if(!t){const m=n===s.turno&&s.fase==='votacao'?'Votação em andamento. O resultado aparece durante a apuração.':n===s.turno&&s.fase==='espera'?'A votação ainda não começou.':'Sem dados de apuração para este turno.';return h+`<div class="c mu">${m}</div>`}
 const ids=[...cands(n)].sort((a,b)=>(t.tot[b]||0)-(t.tot[a]||0)),tr=M.R.length,pa=Math.round(t.n/tr*100);
 const map=`<div class="c"><h2>Mapa da apuração</h2>${mapSVG(r=>{const x=t.reg[r.id];if(!x)return null;let m=null,mv=0;for(const k of ids)if((x[k]||0)>mv){mv=x[k];m=k}return m?C()[m].cor:'#8a8a8a'},rsel)}
  <div class="lg">${ids.map(i=>`<span><i class="dot" style="background:${esc(C()[i].cor)}"></i>${esc(C()[i].nome)}</span>`).join('')}<span><i class="dot" style="background:#ddd;border:1px solid #bbb"></i>Aguardando apuração</span></div>
  <div style="margin-top:10px">${rsel?regInfo(t,rsel,ids):'<div class="mu">Toque numa região para ver os votos.</div>'}</div></div>`;
 const res=`<div><div class="c"><div class="row"><b>${pa}% das regiões apuradas</b><span class="mu" style="margin-left:auto">${t.n} de ${tr}</span></div><div class="bar"><i style="width:${pa}%;background:var(--r)"></i></div></div>
  <div class="c">${ids.map(id=>{const c=C()[id],v=t.tot[id]||0;return `<div class="cd" style="border-left:5px solid ${esc(c.cor)}">${foto1(c)}<div style="flex:1;min-width:0"><div class="n">${esc(c.nome)} <span class="mu">${esc(c.partido)}</span></div><div class="bar"><i style="width:${t.valid?v/t.valid*100:0}%;background:${esc(c.cor)}"></i></div><div class="mu">${v.toLocaleString('pt-BR')} votos${vv(c)?' · Vice '+vv(c):''}</div></div><div class="pct">${pc(v,t.valid)}</div></div>`}).join('')}
  <div class="mu">Brancos: ${t.br} · Votos válidos: ${t.valid}</div></div></div>`;
 return h+`<div class="grid">${map}${res}</div>`}
function regInfo(t,id,ids){const r=RR[id],x=t.reg[id];if(!x)return `<b>${esc(r.n)}</b> · ${esc(RB[r.b].n)}<div class="mu">Ainda não apurada.</div>`;
 const tot=ids.reduce((s,k)=>s+(x[k]||0),0);
 return `<b>${esc(r.n)}</b> · ${esc(RB[r.b].n)}`+ids.slice().sort((a,b)=>(x[b]||0)-(x[a]||0)).map(k=>`<div class="mu"><i class="dot" style="background:${esc(C()[k].cor)}"></i>${esc(C()[k].nome)}: ${x[k]||0} votos (${pc(x[k]||0,tot)})</div>`).join('')+`<div class="mu">Brancos: ${x.branco||0}</div>`}

/* CME */
function cmePanel(){
 const s=S(),f=s.fase,t=tally(s.turno),done=t&&t.n>=M.R.length,ids=Object.keys(C());
 let h=`<div class="c"><div class="k">CME – Conselho Municipal Eleitoral</div><h1>Painel da eleição</h1><div class="mu">${adm?adm.eleitores:0} eleitores cadastrados · ${ids.length} candidatos${adm?' · '+adm.votos+' votos no turno atual':''}</div></div><div class="c"><h2>Controle</h2>`;
 if(f==='espera')h+=`<input id="ttl" value="${esc(s.titulo)}" style="margin-bottom:8px"><button class="btn" data-act="start" ${ids.length>=2?'':'disabled'}>Iniciar 1º turno</button>${ids.length<2?'<div class="mu">Cadastre ao menos 2 candidatos.</div>':''}`;
 if(f==='votacao')h+=`<div style="margin-bottom:8px">${s.turno}º turno aberto</div><button class="btn" data-act="close">Encerrar votação e iniciar apuração</button>`;

async function goLive(){if(LIVE)return;const j=await lk('host'),L=LivekitClient;let wr=null;
 const fname='debate-bype-city-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.webm';
 if(window.showSaveFilePicker){try{wr=await(await showSaveFilePicker({suggestedName:fname,types:[{description:'Vídeo WebM',accept:{'video/webm':['.webm']}}]})).createWritable()}catch(e){}}
 const scr=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 let mic=null;if(MPC){try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true}})}catch(e){}}
 const sys=scr.getAudioTracks()[0],stopAll=()=>{scr.getTracks().forEach(t=>t.stop());if(mic)mic.getTracks().forEach(t=>t.stop())};
 if(!sys&&!confirm('O áudio do sistema não foi compartilhado: o público ouvirá só o seu microfone. Continuar?')){stopAll();if(wr)wr.close();return}
 const ctx=new AudioContext(),pub=ctx.createMediaStreamDestination(),rcd=ctx.createMediaStreamDestination();
 [pub,rcd].forEach(d=>{if(sys)ctx.createMediaStreamSource(new MediaStream([sys])).connect(d);if(mic)ctx.createMediaStreamSource(mic).connect(d)});
 const vt=scr.getVideoTracks()[0],at=pub.stream.getAudioTracks()[0],rt=rcd.stream.getAudioTracks()[0],room=new L.Room();
 room.on(L.RoomEvent.TrackSubscribed,(tr,pb,p)=>{if(tr.kind==='audio'&&p.identity==='host-mic'){const ms=new MediaStream([tr.mediaStreamTrack]),a=new Audio();a.srcObject=ms;a.muted=true;a.play().catch(()=>{});ctx.createMediaStreamSource(ms).connect(rcd)}});

  rec=new MediaRecorder(new MediaStream([vt,rt]),{mimeType:mt,videoBitsPerSecond:3000000});

 rec.onstop=async()=>{if(wr)await wr.close();else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download=fname;a.click()}};
 rec.start(5000);LIVE={room,scr,mic,ctx,rec};vt.onended=()=>stopLive();

 return `<div class="c"><span class="k">Atos oficiais</span><h1>Diário Oficial</h1><div class="row" style="margin-top:8px"><button class="chip${DFIL==='todos'?' on':''}" data-dfil="todos">Todos</button>${ids.map(i=>`<button class="chip${DFIL===i?' on':''}" data-dfil="${esc(i)}">${esc(orgSig(i))}</button>`).join('')}</div></div>`+(L.map(a=>`<div class="c"><div class="row"><span class="k">${esc(a.tipo)} nº ${a.num}/${new Date(a.ts).getFullYear()}</span><span class="chip on">${esc(orgSig(a.orgao))}</span><span class="mu">${dt(a.ts)}</span></div><h2 style="margin:8px 0">${esc(a.titulo)}</h2><div>${para(a.texto)}</div></div>`).join('')||'<div class="c mu">Nenhum ato publicado.</div>')}
function deveres(){if(!DEV)return '<div class="ld">Carregando…</div>';
 return `<div class="c"><span class="k">Administração</span><h1>Deveres dos órgãos</h1><div class="mu">O que cada órgão da cidade é responsável por fazer.</div></div>`+ORG_LIST.map(o=>`<div class="c"><div class="row"><span class="k">${o[1]}</span><a class="chip" href="/${o[0]}" data-nav>Página do órgão</a></div><h2 style="margin:6px 0">${esc(o[2])}</h2>${DEV[o[0]]&&DEV[o[0]].trim()?leisHTML(DEV[o[0]],''):'<div class="mu">Não definido.</div>'}</div>`).join('')}
function conteudoPanel(){if(!NEWS||!DIA)return '<div class="ld">Carregando…</div>';
 const opt=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${x}</option>`).join('');
 return `<div class="c"><h2>Publicar notícia</h2><input id="nt" placeholder="Título" maxlength="120" style="margin-bottom:8px"><select id="nc" style="margin-bottom:8px">${opt(NCATS)}</select><input id="ni" placeholder="Link de imagem https (opcional)" style="margin-bottom:8px"><textarea id="nx" rows="6" placeholder="Texto" maxlength="8000"></textarea><div style="height:8px"></div><button class="btn" data-ca="pubNews">Publicar notícia</button></div>
 <div class="c"><h2>Notícias publicadas (${NEWS.length})</h2>${NEWS.map(n=>`<div class="cd"><div style="flex:1;min-width:0"><div class="n">${esc(n.titulo)}</div><div class="mu">${esc(n.cat)} · ${dt(n.ts)}</div></div><button class="btn s" data-ca="delNews" data-id="${esc(n.id)}">Remover</button></div>`).join('')||'<div class="mu">Nenhuma.</div>'}</div>
 <div class="c"><h2>Publicar no Diário Oficial</h2><select id="dtp" style="margin-bottom:8px">${opt(DTIPOS)}</select><select id="dor" style="margin-bottom:8px"><option value="prefeitura">Prefeitura</option>${ORG_LIST.map(o=>`<option value="${o[0]}">${o[1]} – ${esc(o[2])}</option>`).join('')}</select><input id="dtt" placeholder="Título do ato" maxlength="140" style="margin-bottom:8px"><textarea id="dtx" rows="6" placeholder="Texto do ato" maxlength="10000"></textarea><div style="height:8px"></div><button class="btn" data-ca="pubDia">Publicar ato</button></div>
 <div class="c"><h2>Atos publicados (${DIA.length})</h2>${DIA.map(a=>`<div class="cd"><div style="flex:1;min-width:0"><div class="n">${esc(a.tipo)} nº ${a.num} · ${esc(a.titulo)}</div><div class="mu">${esc(orgSig(a.orgao))} · ${dt(a.ts)}</div></div><button class="btn s" data-ca="delDia" data-id="${esc(a.id)}">Remover</button></div>`).join('')||'<div class="mu">Nenhum.</div>'}</div>`}
function deveresEd(){if(!DEV)return '<div class="ld">Carregando…</div>';const txt=DTE!=null?DTE:(DEV[DSEL]||'');
 return `<div class="c"><h2>Deveres dos órgãos</h2><div class="mu" style="margin-bottom:8px">Um dever por linha, começando com <b>-</b>. Aparece em <b>/deveres</b> e na página de cada órgão.</div><select id="ds" style="margin-bottom:8px">${ORG_LIST.map(x=>`<option value="${x[0]}"${x[0]===DSEL?' selected':''}>${x[1]} – ${esc(x[2])}</option>`).join('')}</select><textarea id="dv" class="big" rows="10">${esc(txt)}</textarea><div style="height:8px"></div><button class="btn" data-ca="saveDev">Salvar deveres</button></div>`}
document.addEventListener('input',e=>{if(e.target.id==='dv')DTE=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='ds'){DSEL=e.target.value;DTE=null;render()}});
document.addEventListener('click',async e=>{
 const f=e.target.closest('[data-dfil]');if(f){DFIL=f.dataset.dfil;return render()}
 const t=e.target.closest('[data-ca]');if(!t)return;const a=t.dataset.ca,v=i=>$(i).value;
 try{
  if(a==='pubNews')await A('newsAdd',{titulo:v('#nt'),cat:v('#nc'),img:v('#ni'),texto:v('#nx')});
  else if(a==='delNews'){if(!confirm('Remover esta notícia?'))return;await A('newsDel',{id:t.dataset.id})}
  else if(a==='pubDia')await A('diaAdd',{tipo:v('#dtp'),orgao:v('#dor'),titulo:v('#dtt'),texto:v('#dtx')});
  else if(a==='delDia'){if(!confirm('Remover este ato do Diário Oficial?'))return;await A('diaDel',{id:t.dataset.id})}
  else if(a==='saveDev'){await A('setDever',{id:DSEL,texto:DTE!=null?DTE:(DEV[DSEL]||'')});DTE=null;alert('Deveres salvos.')}
 }catch(x){alert(x.message);return}
 NEWS=DIA=DEV=null;lastJ='';await load();render()});

route();boot();
</script>
</body>
</html>
