<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleições Bype City</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--r:#7a1fe0;--tx:#1f1f1f;--mu:#6b6b6b;--ln:#e3e3e3;--bg:#f3f3f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Open Sans",Arial,sans-serif}
header{background:var(--r);color:#fff}
.top{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{height:38px;background:#fff;border-radius:4px;padding:2px}
.top b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}.top span{font-size:12px;font-weight:600;opacity:.9;display:block;letter-spacing:.06em;text-transform:uppercase}
nav{background:#fff;border-bottom:1px solid var(--ln)}
nav div{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;font:800 13px "Open Sans",Arial;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:14px 12px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--r);border-color:var(--r)}
main{max-width:1100px;margin:0 auto;padding:16px}
.c{background:#fff;border:1px solid var(--ln);padding:16px;margin-bottom:16px}
.k{color:var(--r);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.k.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--r);margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
h2{font-size:18px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.btn{background:var(--r);color:#fff;border:0;font:800 13px "Open Sans",Arial;letter-spacing:.04em;text-transform:uppercase;padding:12px 18px;cursor:pointer}
.btn.s{background:#fff;color:var(--r);border:2px solid var(--r);padding:10px 16px}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#ddd;flex:none;border:3px solid var(--r)}
.cd{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--ln);margin-bottom:8px;background:#fff}
.cd.pick{cursor:pointer}.cd.on{outline:3px solid var(--r);outline-offset:-3px}
.n{font-weight:800;line-height:1.2}.num{font-size:28px;font-weight:800;margin-left:auto;letter-spacing:-.03em}
.pct{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;text-align:right;min-width:92px}
.bar{height:8px;background:#e9e9e9;margin:6px 0 2px}.bar i{display:block;height:100%;transition:width .6s}
.win{display:flex;gap:16px;align-items:center;border-left:6px solid var(--r);background:#fff;padding:16px;margin-bottom:16px;border-top:1px solid var(--ln);border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.win .ph{width:84px;height:84px}
.map{width:100%;height:auto;display:block;background:#ddd}
.map image{filter:grayscale(1) brightness(1.12) contrast(.85)}
.rg{stroke:#fff;stroke-width:.8;stroke-linejoin:round;cursor:pointer;transition:fill .6s,fill-opacity .6s;fill-opacity:.88}
.rg.off{fill:#e4e4e4;fill-opacity:.4}.rg.sel{stroke:#111;stroke-width:2.2}.rg:hover{stroke:#111}
.bd{fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;pointer-events:none}
.bl{font:800 11px "Open Sans",Arial;fill:#fff;stroke:#000;stroke-width:3;paint-order:stroke;text-anchor:middle;pointer-events:none}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;font-weight:600}
.dot{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
input,select,textarea{font:inherit;border:1px solid #bbb;padding:10px;width:100%;background:#fff;border-radius:0}
input[type=color]{width:56px;height:42px;padding:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--ln);background:#fff;padding:5px 12px;font:600 13px "Open Sans";border-radius:99px;cursor:pointer}.chip.on{background:var(--r);color:#fff;border-color:var(--r)}
.op{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--ln);margin-bottom:6px;cursor:pointer;font-size:14px}.op input{width:auto}.op:has(input:checked){border-color:var(--r);background:#f4ecfd}
fieldset{border:0;border-top:1px solid var(--ln);margin:0;padding:14px 0}legend{font-weight:800;padding:0 0 6px}
footer{max-width:1100px;margin:0 auto;padding:8px 16px 32px;color:var(--mu);font-size:12px}
.ld{padding:60px 20px;text-align:center;color:var(--mu)}
@media(max-width:820px){.grid{grid-template-columns:1fr}h1{font-size:23px}.pct{font-size:21px;min-width:76px}.g2{grid-template-columns:1fr}.top b{font-size:22px}}
</style>
</head>

async function boot(){M=MAPDATA;RB=Object.fromEntries(M.B.map(b=>[b.id,b]));RR=Object.fromEntries(M.R.map(r=>[r.id,r]));await load();setInterval(load,2500)}

/* mapa */
function mapSVG(fill,sel,lb){return `<svg class="map" viewBox="0 0 ${M.W} ${M.H}"><image href="${IMG}" width="${M.W}" height="${M.H}"/>`+
 M.R.map(r=>{const f=fill(r);return `<path class="rg${f?'':' off'}${sel===r.id?' sel':''}" data-r="${r.id}" d="${r.d}"${f?` style="fill:${f}"`:''}/>`}).join('')+
 M.B.map(b=>`<path class="bd" d="${b.d}"/>`).join('')+(lb?M.B.map(b=>`<text class="bl" x="${b.c[0]}" y="${b.c[1]}">${b.s}</text>`).join(''):'')+'</svg>'}

/* dados */
const C=()=>ST.C,S=()=>ST.S,cands=n=>(S()['c'+n]||[]).filter(i=>C()[i]);
function tally(n){const a=ST.AP[n];if(!a)return null;const tot={};let br=0,k=0;
 for(const r in a.reg){k++;for(const c in a.reg[r])c==='branco'?br+=a.reg[r][c]:(tot[c]=(tot[c]||0)+a.reg[r][c])}
 const valid=cands(n).reduce((s,i)=>s+(tot[i]||0),0);return{reg:a.reg,tot,br,n:k,valid}}
const vv=c=>c.vice&&ST.V&&ST.V[c.vice]?esc(ST.V[c.vice].nome):'';
const pc=(v,t)=>(t?v/t*100:0).toFixed(2).replace('.',',')+'%';
const foto1=c=>c.foto?`<img class="ph" src="${c.foto}" alt="" style="border-color:${esc(c.cor)}">`:`<div class="ph" style="border-color:${esc(c.cor)};display:grid;place-items:center;font-weight:800;color:#777">${esc((c.nome||'?')[0])}</div>`;

/* render */
function render(){
 if(!ST)return;const ae=document.activeElement;
 if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&ae.type!=='file'&&ae.type!=='color'){dirty=true;return}
 dirty=false;
 if(FORM){$('#nav').innerHTML='';$('#app').innerHTML=formPage();return}
 const tabs=[['eleicao','Eleição'],['apuracao','Apuração'],['candidatos','Candidatos'],['cme','CME']];
 $('#nav').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');
 $('#app').innerHTML={eleicao:home,apuracao:results,candidatos:list,cme:panel}[tab]()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()},60));

function home(){const s=S(),me=ST.me,f=s.fase;
 let h=`<div class="c"><span class="k${f==='votacao'?' live':''}">${{espera:'Em breve',votacao:'Votação aberta',apuracao:'Apuração em andamento',encerrada:'Encerrada'}[f]}</span><h1>${esc(s.titulo)}</h1><div class="mu">${s.turno}º turno</div></div>`;
 if(f==='encerrada'&&s.eleito&&C()[s.eleito])h+=winner();
 if(!me)return h+`<div class="c"><h2>Cadastro do eleitor</h2><p class="mu">Informe seu nome e a região onde você mora em Bype City. Depois de confirmada, ela não pode ser alterada.</p>
  <div class="grid"><div>${mapSVG(r=>r.id===selR?'#7a1fe0':null,selR,true)}</div><div>
  <input id="rn" placeholder="Seu nome" value="${esc(regName)}" maxlength="40" style="margin-bottom:8px">
  <select id="rr"><option value="">Escolha sua região</option>${M.B.map(b=>`<optgroup label="${esc(b.n)}">${M.R.filter(r=>r.b===b.id).map(r=>`<option value="${r.id}"${r.id===selR?' selected':''}>${esc(r.n)}</option>`).join('')}</optgroup>`).join('')}</select>
  <div style="height:10px"></div><button class="btn" data-act="reg" ${busy?'disabled':''}>Confirmar cadastro</button></div></div></div>`;
 h+=`<div class="c"><div class="mu">Você vota em <b>${esc(RR[me.r].n)}</b> (${esc(RB[RR[me.r].b].n)}) · ${esc(me.n)}</div></div>`;
 if(f==='votacao'){
  if(me.voted)h+=`<div class="c"><h2>Voto registrado no ${s.turno}º turno</h2><div class="mu">Acompanhe o resultado na aba Apuração.</div></div>`;
  else h+=`<div class="c"><h2>Escolha seu candidato</h2>${cands(s.turno).map(id=>card(id,true)).join('')}
   <div class="cd pick${selC==='branco'?' on':''}" data-c="branco"><div class="ph" style="display:grid;place-items:center;border-color:#999">▢</div><div class="n">Voto em branco</div></div>
   <button class="btn" style="width:100%" data-act="vote" ${selC&&!busy?'':'disabled'}>Confirmar voto</button></div>`}
 else if(f==='apuracao')h+=`<div class="c"><h2>Votação encerrada</h2><button class="btn" data-tab="apuracao">Acompanhar apuração</button></div>`;
 else if(f==='espera')h+=`<div class="c"><div class="mu">Aguarde: o CME ainda não abriu a votação.</div></div>`;
 return h}
function card(id,pick){const c=C()[id];return `<div class="cd${pick?' pick':''}${pick&&selC===id?' on':''}" ${pick?`data-c="${id}"`:''}>${foto1(c)}<div><div class="n">${esc(c.nome)}</div><div class="mu">${esc(c.partido)}${c.plano?' · '+esc(c.plano):''}</div>${vv(c)?`<div class="mu">Vice: <b>${vv(c)}</b></div>`:''}</div><div class="num" style="color:${esc(c.cor)}">${esc(c.num)}</div></div>`}
function winner(){const c=C()[S().eleito];return `<div class="win" style="border-left-color:${esc(c.cor)}">${foto1(c)}<div><div class="k">Eleito${S().turno===1?' no 1º turno':' no 2º turno'}</div><div style="font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1">${esc(c.nome)}</div><div class="mu">${esc(c.partido)} · ${esc(c.num)}</div>${vv(c)?`<div class="mu">Vice-prefeito: <b>${vv(c)}</b></div>`:''}</div></div>`}
function list(){const ids=Object.keys(C());return `<div class="c"><span class="k">Candidatos</span><h1>Quem disputa</h1></div>`+(ids.length?`<div class="cg">${ids.map(id=>`<div class="c" style="margin:0;text-align:center;border-top:5px solid ${esc(C()[id].cor)}"><div style="display:flex;justify-content:center;margin-bottom:8px">${foto1(C()[id]).replace('class="ph"','class="ph" style="width:96px;height:96px;border-color:'+esc(C()[id].cor)+'"')}</div><div class="n">${esc(C()[id].nome)}</div><div class="mu">${esc(C()[id].partido)}</div>${vv(C()[id])?`<div class="mu">Vice: <b>${vv(C()[id])}</b></div>`:''}<div class="num" style="margin:4px 0;color:${esc(C()[id].cor)}">${esc(C()[id].num)}</div><div class="mu">${esc(C()[id].plano)}</div></div>`).join('')}</div>`:'<div class="c mu">Nenhum candidato cadastrado ainda.</div>')}

function results(){
 const s=S(),n=vt||s.turno,both=s.turno===2||(s.c2||[]).length,live=s.fase==='apuracao'&&n===s.turno;
 let h=`<div class="c"><div class="row"><span class="k${live?' live':''}">${live?'Ao vivo':'Resultado'}</span><div style="margin-left:auto" class="row">${both?[1,2].map(k=>`<button class="chip${n===k?' on':''}" data-vt="${k}">${k}º turno</button>`).join(''):''}</div></div><h1>${esc(s.titulo)}</h1></div>`;
 if(s.fase==='encerrada'&&s.eleito&&n===s.turno&&C()[s.eleito])h+=winner();
 const t=tally(n);
 if(!t){const m=n===s.turno&&s.fase==='votacao'?'Votação em andamento. O resultado aparece durante a apuração.':n===s.turno&&s.fase==='espera'?'A votação ainda não começou.':'Sem dados de apuração para este turno.';return h+`<div class="c mu">${m}</div>`}
 const ids=[...cands(n)].sort((a,b)=>(t.tot[b]||0)-(t.tot[a]||0)),tr=M.R.length,pa=Math.round(t.n/tr*100);
 const map=`<div class="c"><h2>Mapa da apuração</h2>${mapSVG(r=>{const x=t.reg[r.id];if(!x)return null;let m=null,mv=0;for(const k of ids)if((x[k]||0)>mv){mv=x[k];m=k}return m?C()[m].cor:'#8a8a8a'},rsel)}
  <div class="lg">${ids.map(i=>`<span><i class="dot" style="background:${esc(C()[i].cor)}"></i>${esc(C()[i].nome)}</span>`).join('')}<span><i class="dot" style="background:#ddd;border:1px solid #bbb"></i>Aguardando apuração</span></div>
  <div style="margin-top:10px">${rsel?regInfo(t,rsel,ids):'<div class="mu">Toque numa região para ver os votos.</div>'}</div></div>`;
 const res=`<div><div class="c"><div class="row"><b>${pa}% das regiões apuradas</b><span class="mu" style="margin-left:auto">${t.n} de ${tr}</span></div><div class="bar"><i style="width:${pa}%;background:var(--r)"></i></div></div>
  <div class="c">${ids.map(id=>{const c=C()[id],v=t.tot[id]||0;return `<div class="cd" style="border-left:5px solid ${esc(c.cor)}">${foto1(c)}<div style="flex:1;min-width:0"><div class="n">${esc(c.nome)} <span class="mu">${esc(c.partido)}</span></div><div class="bar"><i style="width:${t.valid?v/t.valid*100:0}%;background:${esc(c.cor)}"></i></div><div class="mu">${v.toLocaleString('pt-BR')} votos${vv(c)?' · Vice '+vv(c):''}</div></div><div class="pct">${pc(v,t.valid)}</div></div>`}).join('')}
  <div class="mu">Brancos: ${t.br} · Votos válidos: ${t.valid}</div></div></div>`;
 return h+`<div class="grid">${map}${res}</div>`}
function regInfo(t,id,ids){const r=RR[id],x=t.reg[id];if(!x)return `<b>${esc(r.n)}</b> · ${esc(RB[r.b].n)}<div class="mu">Ainda não apurada.</div>`;
 const tot=ids.reduce((s,k)=>s+(x[k]||0),0);
 return `<b>${esc(r.n)}</b> · ${esc(RB[r.b].n)}`+ids.slice().sort((a,b)=>(x[b]||0)-(x[a]||0)).map(k=>`<div class="mu"><i class="dot" style="background:${esc(C()[k].cor)}"></i>${esc(C()[k].nome)}: ${x[k]||0} votos (${pc(x[k]||0,tot)})</div>`).join('')+`<div class="mu">Brancos: ${x.branco||0}</div>`}

/* CME */
function panel(){
 if(!pw)return `<div class="c" style="max-width:420px"><span class="k">CME – Conselho Municipal Eleitoral</span><h2>Acesso restrito</h2><input id="pw" type="password" placeholder="Senha do CME" style="margin-bottom:8px"><button class="btn" data-act="login">Entrar</button></div>`;
 const s=S(),f=s.fase,t=tally(s.turno),done=t&&t.n>=M.R.length,ids=Object.keys(C());
 let h=`<div class="c"><div class="row"><span class="k">CME – Conselho Municipal Eleitoral</span><button class="chip" data-act="logout" style="margin-left:auto">Sair</button></div><h1>Painel da eleição</h1><div class="mu">${adm?adm.eleitores:0} eleitores cadastrados · ${ids.length} candidatos${adm?' · '+adm.votos+' votos no turno atual':''}</div></div><div class="c"><h2>Controle</h2>`;
 if(f==='espera')h+=`<input id="ttl" value="${esc(s.titulo)}" style="margin-bottom:8px"><button class="btn" data-act="start" ${ids.length>=2?'':'disabled'}>Iniciar 1º turno</button>${ids.length<2?'<div class="mu">Cadastre ao menos 2 candidatos.</div>':''}`;
 if(f==='votacao')h+=`<div style="margin-bottom:8px">${s.turno}º turno aberto</div><button class="btn" data-act="close">Encerrar votação e iniciar apuração</button>`;
 if(f==='apuracao')h+=`<div>Apuração do ${s.turno}º turno · ${t?t.n:0}/${M.R.length} regiões</div><div class="row" style="margin:8px 0"><button class="btn" data-act="rev1" ${done?'disabled':''}>Apurar próxima</button><button class="btn s" data-act="rev5" ${done?'disabled':''}>Apurar 5</button><button class="btn s" data-act="revAll" ${done?'disabled':''}>Apurar tudo</button><button class="btn s" data-act="auto" ${done?'disabled':''}>${auto?'Pausar automático':'Automático'}</button></div><button class="btn" data-act="finish" ${done?'':'disabled'}>Encerrar apuração</button>`;
 if(f==='encerrada'){h+=`<div style="margin-bottom:8px">${s.eleito&&C()[s.eleito]?'Eleito: <b>'+esc(C()[s.eleito].nome)+'</b>':'Nenhum candidato passou de 50% dos votos válidos.'}</div><div class="row">`;
  if(!s.eleito&&s.turno===1)h+=`<button class="btn" data-act="second">Iniciar 2º turno</button>`;h+=`<button class="btn s" data-act="reset">Nova eleição</button></div>`}
 h+=`</div>${proc()}<div class="c"><h2>Novo candidato</h2><div class="g2"><input id="cn" placeholder="Nome"><input id="cp" placeholder="Partido"></div><div class="g2"><input id="cu" placeholder="Número" inputmode="numeric"><input id="cl" placeholder="Plano (opcional)"></div>
  <div class="row"><label class="mu">Cor</label><input type="color" id="cc" value="#c4170c"><input type="file" id="cf" accept="image/*" style="flex:1;min-width:160px"><button class="btn" data-act="addC" ${busy?'disabled':''}>Adicionar</button></div></div>
  <div class="c"><h2>Candidatos</h2>${ids.map(id=>{const c=C()[id];return `<div class="cd">${foto1(c)}<div style="flex:1;min-width:0"><div class="n">${esc(c.nome)}</div><div class="mu">${esc(c.partido)} · ${esc(c.num)}</div><div class="row" style="margin-top:6px"><select data-vice="${id}" style="width:auto;max-width:150px"><option value="">Sem vice</option>${Object.entries(ST.V||{}).map(([k,v])=>`<option value="${k}"${c.vice===k?' selected':''}>${esc(v.nome)}</option>`).join('')}</select><input type="color" data-col="${id}" value="${esc(c.cor)}"><label class="chip">Trocar foto<input type="file" accept="image/*" data-pic="${id}" style="display:none"></label></div></div><button class="btn s" data-del="${id}">Remover</button></div>`}).join('')||'<div class="mu">Nenhum candidato.</div>'}</div>`;
 return h}

function proc(){
 const a=adm||{subs:[],cfg:{pss:true,psv:true,min:12}},base=location.origin+location.pathname,T={pss:'PSS · Prefeito',psv:'PSV · Vice-prefeito'};
 const lk=t=>`<div class="row" style="margin-bottom:8px"><b style="min-width:44px">${t.toUpperCase()}</b><input readonly value="${base}?f=${t}" style="flex:1;min-width:150px"><button class="btn s" data-copy="${base}?f=${t}">Copiar</button><button class="btn s" data-form="${t}">Abrir</button><button class="btn s" data-tog="${t}">${a.cfg[t]?'Fechar':'Reabrir'}</button></div>`;
 const row=s=>{const ok=s.acertos>=a.cfg.min;return `<div class="cd"><div style="flex:1;min-width:0"><div class="n">${esc(s.nome)} <span class="mu">${esc(s.partido)}</span></div><div class="mu">${esc(s.motivo.slice(0,140))}</div><div class="row" style="margin-top:4px"><span class="k" style="color:${ok?'#2e7d32':'#c4170c'}">${s.acertos}/${s.total} acertos · ${ok?'Aprovado':'Reprovado'}</span><span class="mu">${s.status}</span></div></div>${s.status==='pendente'?`<div class="row"><button class="btn" data-act="accept" data-sid="${s.id}" ${ok?'':'disabled'}>Aceitar</button><button class="btn s" data-act="reject" data-sid="${s.id}">Recusar</button></div>`:''}</div>`};
 const V=Object.entries(ST.V||{});
 return `<div class="c"><h2>Processos seletivos</h2><div class="mu" style="margin-bottom:10px">Envie o link do formulário. Só quem atingir a nota mínima pode ser aceito como candidato.</div>${lk('pss')}${lk('psv')}
  <div class="row" style="margin:10px 0"><label class="mu">Nota mínima (acertos de 15)</label><input id="mn" type="number" min="1" max="15" value="${a.cfg.min}" style="width:80px"><button class="btn s" data-act="min">Salvar</button></div></div>
  ${['pss','psv'].map(t=>{const l=a.subs.filter(s=>s.tipo===t);return `<div class="c"><h2>${T[t]} — inscrições (${l.length})</h2>${l.map(row).join('')||'<div class="mu">Nenhuma inscrição recebida.</div>'}</div>`}).join('')}
  <div class="c"><h2>Vices aprovados</h2>${V.map(([k,v])=>`<div class="cd"><div style="flex:1"><div class="n">${esc(v.nome)}</div><div class="mu">${esc(v.partido)}</div></div><button class="btn s" data-delv="${k}">Remover</button></div>`).join('')||'<div class="mu">Nenhum vice aprovado ainda. Aceite inscrições do PSV e escolha o vice de cada candidato abaixo.</div>'}</div>`}

function formPage(){
 const q=FQ;if(!q)return '<div class="ld">Carregando…</div>';const back=window.DEMO||sessionStorage.getItem('bype_pw')?'<button class="chip" data-form="">← Voltar ao site</button>':'';
 if(fdone)return `<div class="c"><span class="k">${q.tipo.toUpperCase()}</span><h1>Inscrição enviada</h1><p class="mu">Recebemos suas respostas. O CME – Conselho Municipal Eleitoral vai analisar e entrar em contato.</p>${back}</div>`;
 if(!q.aberto)return `<div class="c"><span class="k">${q.tipo.toUpperCase()}</span><h1>Inscrições encerradas</h1><p class="mu">Este processo seletivo não está recebendo inscrições no momento.</p>${back}</div>`;
 return `<div class="c"><div class="row"><span class="k">CME – Conselho Municipal Eleitoral</span><span style="margin-left:auto">${back}</span></div><h1>${esc(q.titulo)}</h1><p class="mu">Preencha seus dados e responda às ${q.perguntas.length} questões. Só quem atingir a nota mínima poderá ser aceito como ${q.tipo==='pss'?'candidato a prefeito':'candidato a vice-prefeito'}.</p></div>
 <div class="c"><h2>Seus dados</h2><div class="g2"><input id="fn" placeholder="Nome completo" maxlength="60" value="${esc(FD.nome)}"><input id="fp" placeholder="Partido" maxlength="30" value="${esc(FD.partido)}"></div>
  <textarea id="fm" rows="3" maxlength="600" placeholder="Por que você quer ${q.tipo==='pss'?'ser prefeito':'ser vice-prefeito'} de Bype City?" style="margin-bottom:8px">${esc(FD.motivo)}</textarea>
  <textarea id="fz" rows="3" maxlength="600" placeholder="Suas principais propostas para a cidade" style="margin-bottom:8px">${esc(FD.proposta)}</textarea>
  <label class="mu">Foto (opcional)</label><input type="file" id="ff" accept="image/*"></div>
 <div class="c"><h2>Prova</h2>${q.perguntas.map((x,i)=>`<fieldset><legend>${i+1}. ${esc(x.q)}</legend>${x.o.map((o,j)=>`<label class="op"><input type="radio" name="q${i}" value="${j}"${FD.r[i]===j?' checked':''}>${esc(o)}</label>`).join('')}</fieldset>`).join('')}
  <button class="btn" data-act="sub" ${busy?'disabled':''} style="width:100%;margin-top:8px">Enviar inscrição</button></div>`}

/* ações */
function resize(file){return new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);
 c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);ok(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(file)})}
async function act(a,t){
 try{
  if(a==='sub'){const n=FD.nome||'',pt=FD.partido||'';if(FD.r.filter(x=>x!=null).length<FQ.perguntas.length)throw new Error('Responda todas as questões.');
   busy=true;await post('/api/inscricao',{tipo:FORM,nome:n,partido:pt,motivo:FD.motivo||'',proposta:FD.proposta||'',foto:FD.foto||'',resp:FD.r});fdone=true;FD={r:[]}}
  else if(a==='accept'||a==='reject')await A(a,{id:t.dataset.sid});
  else if(a==='min')await A('setForm',{min:+$('#mn').value});
  else if(a==='reg'){busy=true;const j=await post('/api/register',{name:regName,r:selR});token=j.token;localStorage.setItem('bype_token',token)}
  else if(a==='vote'){busy=true;await post('/api/vote',{token,c:selC});selC=null}
  else if(a==='login'){pw=$('#pw').value;try{await A('login')}catch(e){pw=null;throw e}sessionStorage.setItem('bype_pw',pw)}
  else if(a==='logout'){pw=null;sessionStorage.removeItem('bype_pw');clearInterval(auto);auto=null}
  else if(a==='start')await A('start',{titulo:($('#ttl')||{}).value});
  else if(a==='close'||a==='finish'||a==='second')await A(a);
  else if(a==='reset'){if(!confirm('Começar uma nova eleição?'))return;clearInterval(auto);auto=null;await A('reset')}
  else if(a==='rev1')await A('reveal',{k:1});else if(a==='rev5')await A('reveal',{k:5});else if(a==='revAll')await A('reveal',{k:99});
  else if(a==='auto'){if(auto){clearInterval(auto);auto=null}else auto=setInterval(async()=>{try{await A('reveal',{k:1});await load()}catch(e){clearInterval(auto);auto=null}},2500)}
  else if(a==='addC'){busy=true;await A('addC',{nome:$('#cn').value,partido:$('#cp').value,num:$('#cu').value,plano:$('#cl').value,cor:$('#cc').value,foto:foto||''});foto=null}
 }catch(e){alert(e.message)}
 busy=false;lastJ='';await load();render()}
document.addEventListener('input',e=>{const i=e.target.id;if(i==='rn')regName=e.target.value;const m={fn:'nome',fp:'partido',fm:'motivo',fz:'proposta'}[i];if(m)FD[m]=e.target.value});
document.addEventListener('change',async e=>{const t=e.target;
 if(/^q\d+$/.test(t.name||'')){FD.r[+t.name.slice(1)]=+t.value;return}
 if(t.id==='ff'&&t.files[0]){FD.foto=await resize(t.files[0]);return}
 if(t.dataset.vice!=null&&t.dataset.vice!==''){try{await A('setC',{id:t.dataset.vice,vice:t.value})}catch(x){alert(x.message)}lastJ='';return load()}
 if(t.id==='rr'){selR=t.value||null;return render()}
 if(t.id==='cf'&&t.files[0])foto=await resize(t.files[0]);
 if(t.dataset.pic&&t.files[0]){try{await A('setC',{id:t.dataset.pic,foto:await resize(t.files[0])})}catch(x){alert(x.message)}lastJ='';load()}
 if(t.dataset.col){try{await A('setC',{id:t.dataset.col,cor:t.value})}catch(x){alert(x.message)}lastJ='';load()}});
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-tab],[data-act],[data-r],[data-c],[data-vt],[data-del],[data-copy],[data-form],[data-tog],[data-delv]');if(!t)return;const d=t.dataset;
 if(d.copy){try{await navigator.clipboard.writeText(d.copy);t.textContent='Copiado!'}catch(x){prompt('Copie o link:',d.copy)}return}
 if(d.form!=null){FORM=d.form||null;FQ=null;fdone=false;lastJ='';if(FORM)FQ=await api('/api/form/'+FORM);return render()}
 if(d.tog){const o=adm&&adm.cfg;try{await A('setForm',{[d.tog]:!(o&&o[d.tog])})}catch(x){alert(x.message)}lastJ='';return load()}
 if(d.delv){if(!confirm('Remover este vice?'))return;try{await A('delV',{id:d.delv})}catch(x){alert(x.message)}lastJ='';return load()}
 if(d.tab){tab=d.tab;lastJ='';return load().then(render)}
 if(d.act)return act(d.act,t);
 if(d.del){const c=C()[d.del];if(!confirm('Remover '+(c?c.nome:'candidato')+'?'))return;try{await A('delC',{id:d.del})}catch(x){alert(x.message)}lastJ='';return load()}
 if(d.vt){vt=+d.vt;return render()}
 if(d.c){selC=d.c;return render()}
 if(d.r){if(tab==='apuracao')rsel=d.r;else selR=d.r;render()}});
boot();
</script>
</body>
